name: Install graphics CMS schema

on:
  push:
    paths:
      - graphics-schema-snippet.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Merge graphics schema without replacing existing CMS settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          cfg = Path('.pages.yml')
          snippet = Path('graphics-schema-snippet.yml').read_text(encoding='utf-8')
          original = cfg.read_text(encoding='utf-8')
          if '  - name: graphics_content\n' in original:
              print('Graphics CMS already installed; no change needed.')
          else:
              graphics = original.index('- name: graphics\n')
              position = original.index('  - name: header_config\n', graphics)
              cfg.write_text(original[:position] + snippet.rstrip('\n') + '\n' + original[position:], encoding='utf-8')
              print('Graphics CMS schema merged without replacing existing settings.')
          PY
      - name: Commit schema update when needed
        run: |
          if git diff --quiet -- .pages.yml; then
            echo 'No schema changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .pages.yml
          git commit -m 'cms: enable graphics file cards editor'
          git push
