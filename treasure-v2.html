<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كنز التصميم</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f5efe3;font-family:Tahoma,Arial;text-align:center;padding:24px}.card{max-width:520px;background:#17151b;border:1px solid #4c3c16;border-radius:20px;padding:26px;box-shadow:0 18px 50px #0007}h1{margin:0 0 10px;color:#e0b23d}p{color:#c9c0cf;line-height:1.8}.gift{font-size:42px}button{margin-top:14px;padding:12px 18px;border:0;border-radius:12px;background:#e0b23d;color:#17120a;font-weight:bold}</style></head><body><div class="card"><div class="gift">🎁</div><h1>كنز تصميم جديد</h1><p id="msg">جارٍ اختيار كنز جديد غير مكرر…</p><button id="retry" hidden>حاول مرة أخرى</button></div><script>
const BASE='https://monagyai.github.io/designlibrary/';
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function go(){const msg=document.getElementById('msg'),retry=document.getElementById('retry');retry.hidden=true;try{const [a,m]=await Promise.all([fetch(BASE+'app-config.json?ts='+Date.now(),{cache:'no-store'}),fetch(BASE+'monetization-config-v3.json?ts='+Date.now(),{cache:'no-store'}).catch(()=>null)]);if(!a.ok)throw Error();const c=await a.json();let pool=(c.categories||[]).filter(x=>x&&x.enabled!==false&&x.page);if(m&&m.ok){try{const mc=await m.json();const d=mc.features?.dailyTreasure;if(d?.poolMode==='selected'&&Array.isArray(d.categoryIndexes)&&d.categoryIndexes.length){const ids=new Set(d.categoryIndexes.map(Number));const chosen=pool.filter(x=>ids.has(Number(x.index)));if(chosen.length)pool=chosen}}catch(e){}}if(!pool.length)throw Error();const key='dl-treasure-used-'+dayKey();let used=[];try{used=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}const valid=new Set(pool.map(x=>String(x.index)));used=used.map(String).filter(x=>valid.has(x));let remaining=pool.filter(x=>!used.includes(String(x.index)));if(!remaining.length){used=[];remaining=pool.slice()}shuffle(remaining);const pick=remaining[0];used.push(String(pick.index));localStorage.setItem(key,JSON.stringify(used));msg.textContent='كنزك الجديد: '+(pick.ar||pick.en||'');setTimeout(()=>location.replace(new URL(pick.page,BASE).href),450)}catch(e){msg.textContent='تعذر فتح الكنز الآن. تحقق من الاتصال وحاول مرة أخرى.';retry.hidden=false}}
document.getElementById('retry').onclick=go;go();
</script></body></html>
