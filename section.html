<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مكتبة التصميم</title>
<style>
:root{color-scheme:dark;--bg:#020b13;--panel:#0d1c2a;--line:#2b4053;--gold:#e3ad39;--text:#f7f3e8;--muted:#afbdc9;--green:#1bc8a5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131e,#020b13);color:var(--text);font-family:Arial,Tahoma,sans-serif;min-height:100vh}.resource-wrap{max-width:980px;margin:auto;padding:18px 14px 38px}.section-head{border:1px solid #d7aa4655;background:linear-gradient(145deg,#151b22,#091521);border-radius:20px;padding:17px;margin-bottom:14px}.section-head .tag{display:inline-block;background:#073b32;color:#82efd8;border:1px solid #1bc8a577;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:800;letter-spacing:.4px}.section-head h1{font-size:23px;margin:10px 0 5px}.section-head p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}.resource-grid{display:grid;grid-template-columns:1fr;gap:11px}.resource-card{border:1px solid var(--line);background:linear-gradient(180deg,#102235,#07131f);border-radius:18px;padding:12px;display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;box-shadow:0 8px 22px #0004}.resource-image{width:92px;height:92px;border-radius:13px;background:radial-gradient(circle at 70% 20%,#7d62ff55,transparent 40%),#0b1621;border:1px solid #ffffff16;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:30px}.resource-image img{width:100%;height:100%;object-fit:cover;display:block}.resource-body{min-width:0}.resource-badge{display:inline-block;border-radius:999px;padding:4px 7px;background:#322711;color:#f0c96d;border:1px solid #e3ad3966;font-size:8px;font-weight:800}.resource-card h2{font-size:14px;line-height:1.5;margin:7px 0 4px}.resource-card p{font-size:11px;line-height:1.65;color:var(--muted);margin:0}.resource-actions{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;margin-top:1px}.resource-actions a,.resource-actions button{appearance:none;border-radius:11px;padding:10px 12px;font:800 11px Arial,Tahoma;text-decoration:none;cursor:pointer}.open-btn{background:linear-gradient(#efc95d,#d7a52f);color:#171108;border:1px solid #f5d98e}.download-btn{background:#0b2830;color:#8aefdf;border:1px solid #1bc8a566}.share-btn{background:#101d2a;color:#e8eef4;border:1px solid #496177}.empty-state,.error-state{text-align:center;color:var(--muted);padding:50px 18px;line-height:1.9;border:1px dashed #31465a;border-radius:18px}.error-state{color:#ffd4d4;background:#301717;border-style:solid;border-color:#8f3b3b}@media(min-width:760px){.resource-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.resource-card{grid-template-columns:110px minmax(0,1fr)}.resource-image{width:110px;height:110px}}
</style>
</head><body>
<main class="resource-wrap">
  <header class="section-head"><span id="freeTag" class="tag">مجاني بالكامل</span><h1 id="sectionTitle">القسم</h1><p id="sectionSubtitle"></p></header>
  <section id="resourceGrid" class="resource-grid"></section><div id="state" class="empty-state">جاري تحميل المحتوى…</div>
</main>
<script>
(()=>{
const allowed=new Set(['graphics','courses','marketing','programs','three-d','books','ai','other']);const key=new URLSearchParams(location.search).get('section')||'';let portal=null,library=null,lastLang='';const $=id=>document.getElementById(id);
function lang(){const q=new URLSearchParams(location.search).get('lang');const n=window.__dlLang;return (n==='ar'||n==='en')?n:(q==='en'?'en':'ar')}
function safeUrl(raw){if(!raw)return '';try{const u=new URL(raw,location.href);if(u.protocol!=='https:')return '';return u.href}catch(e){return ''}}
function currentSection(){return portal?.sections?.find(x=>x&&x.id===key)||null}
function render(){if(!portal||!library)return;const en=lang()==='en';lastLang=en?'en':'ar';document.documentElement.lang=lastLang;document.documentElement.dir=en?'ltr':'rtl';const sec=currentSection();if(!sec){fail();return}const title=en?(sec.en||sec.ar):(sec.ar||sec.en);document.title=title;$('sectionTitle').textContent=title;$('sectionSubtitle').textContent=en?(sec.descriptionEn||''):(sec.descriptionAr||'');$('freeTag').textContent=en?'100% FREE':'مجاني بالكامل';const items=(Array.isArray(library.items)?library.items:[]).filter(x=>x&&x.section===key&&x.enabled!==false).sort((a,b)=>(a.order||0)-(b.order||0));const g=$('resourceGrid');g.replaceChildren();const st=$('state');st.hidden=!!items.length;if(!items.length){st.className='empty-state';st.textContent=en?'This section is ready. Add content from the CMS and it will appear here automatically.':'القسم جاهز. أضف المحتوى من لوحة التحكم وسيظهر هنا تلقائيًا.';return}for(const x of items){const ttl=en?(x.titleEn||x.titleAr):(x.titleAr||x.titleEn);const desc=en?(x.descriptionEn||''):(x.descriptionAr||'');const url=safeUrl(x.url),dl=safeUrl(x.downloadUrl),img=safeUrl(x.image);const card=document.createElement('article');card.className='resource-card';const media=document.createElement('div');media.className='resource-image';if(img){const im=document.createElement('img');im.src=img;im.alt=ttl;im.loading='lazy';media.appendChild(im)}else media.textContent=key==='books'?'📘':key==='ai'?'✨':key==='three-d'?'🧊':'🎨';const body=document.createElement('div');body.className='resource-body';const badge=document.createElement('span');badge.className='resource-badge';badge.textContent=en?(x.badgeEn||'FREE'):(x.badgeAr||'مجاني');const h=document.createElement('h2');h.textContent=ttl;const p=document.createElement('p');p.textContent=desc;body.append(badge,h,p);const actions=document.createElement('div');actions.className='resource-actions';if(url){const a=document.createElement('a');a.className='open-btn';a.href=url;if(url.startsWith(location.origin+'/designlibrary/')){const u=new URL(url);u.searchParams.set('lang',lastLang);a.href=u.href}a.textContent=en?'Open':'فتح';actions.appendChild(a)}if(dl){const a=document.createElement('a');a.className='download-btn';a.href=dl;a.textContent=en?'Download':'تحميل';actions.appendChild(a)}const shareTarget=url||dl;if(shareTarget){const b=document.createElement('button');b.className='share-btn';b.type='button';b.textContent=en?'Share':'مشاركة';b.onclick=()=>share(shareTarget,ttl);actions.appendChild(b)}card.append(media,body,actions);g.appendChild(card)}}
async function share(url,title){const en=lang()==='en';try{if(navigator.share){await navigator.share({title,url});return}await navigator.clipboard.writeText(url);alert(en?'Link copied.':'تم نسخ الرابط.')}catch(e){}}
function fail(){$('state').className='error-state';$('state').textContent=lang()==='en'?'Unable to load content. Tap Reload.':'تعذر تحميل المحتوى. اضغط تحديث.'}
if(!allowed.has(key)){fail();return}Promise.all([fetch('portal-config.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}),fetch('library-content.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()})]).then(([p,l])=>{if(!p||p.schemaVersion!==1||!Array.isArray(p.sections)||!l||l.schemaVersion!==1||!Array.isArray(l.items))throw Error();portal=p;library=l;render()}).catch(fail);setInterval(()=>{if(portal&&library&&lang()!==lastLang)render()},250);
})();
</script>
</body></html>
