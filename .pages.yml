media:
  input: cms-media
  output: /designlibrary/cms-media
  rename: safe
  categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "cms: update {path}"
      create: "cms: create {path}"
      delete: "cms: delete {path}"
      rename: "cms: rename {oldPath} -> {newPath}"

content:
  - name: app
    label: "التطبيق والمكتبة"
    type: group
    items:
      - name: app_config
        label: "الأقسام والترجمة والتواصل"
        type: file
        path: app-config.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schemaVersion
            label: "Schema Version"
            type: number
            readonly: true
          - name: revision
            label: "Revision"
            type: number
            description: "يمكن زيادته عند عمل تحديث كبير."
          - name: announcement
            label: "رسالة التطبيق"
            type: object
            fields:
              - name: ar
                label: "الرسالة بالعربية"
                type: text
              - name: en
                label: "English message"
                type: text
          - name: social
            label: "روابط التواصل"
            type: object
            fields:
              - name: facebook
                label: "Facebook"
                type: string
              - name: youtube
                label: "YouTube"
                type: string
              - name: whatsapp
                label: "WhatsApp"
                type: string
                description: "مثال: https://wa.me/201xxxxxxxxx"
          - name: categories
            label: "أقسام المكتبة"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{ar} · {en}"
            fields:
              - name: index
                label: "الترتيب"
                type: number
              - name: ar
                label: "الاسم بالعربية"
                type: string
                required: true
              - name: en
                label: "English name"
                type: string
                required: true
              - name: page
                label: "اسم الصفحة / الرابط"
                type: string
                required: true
              - name: thumbnails
                label: "صور المعاينة"
                type: string
                list: true
              - name: enabled
                label: "إظهار القسم"
                type: boolean

      - name: header_config
        label: "الهيدر والهوية"
        type: file
        path: header-config.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schemaVersion
            label: "Schema Version"
            type: number
            readonly: true
          - name: revision
            label: "Revision"
            type: number
          - name: enabled
            label: "تفعيل الهيدر البعيد"
            type: boolean
          - name: image
            label: "رابط صورة الهيدر"
            type: string
            description: "ضع رابط HTTPS مباشر للصورة. المقاس المقترح 1500×500."
          - name: heightDp
            label: "ارتفاع الهيدر"
            type: number
            options:
              min: 70
              max: 220
          - name: scaleType
            label: "طريقة عرض الصورة"
            type: select
            options:
              values:
                - name: centerCrop
                  label: "ملء المساحة"
                - name: fitCenter
                  label: "إظهار الصورة كاملة"

  - name: ai
    label: "الذكاء الاصطناعي — مجاني"
    type: group
    items:
      - name: ai_config
        label: "AI Creative Hub"
        type: file
        path: ai-config.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schemaVersion
            label: "Schema Version"
            type: number
            readonly: true
          - name: revision
            label: "Revision"
            type: number
            description: "زوده عند عمل تغيير كبير في القسم."
          - name: enabled
            label: "إظهار قسم الذكاء الاصطناعي"
            type: boolean
          - name: title
            label: "عنوان القسم"
            type: object
            fields:
              - name: ar
                label: "العنوان بالعربية"
                type: string
              - name: en
                label: "English title"
                type: string
          - name: subtitle
            label: "الوصف الرئيسي"
            type: object
            fields:
              - name: ar
                label: "الوصف بالعربية"
                type: text
              - name: en
                label: "English description"
                type: text
          - name: comingSoonMessage
            label: "رسالة قريبًا"
            type: object
            fields:
              - name: ar
                label: "الرسالة بالعربية"
                type: text
              - name: en
                label: "English message"
                type: text
          - name: freeLabel
            label: "وسم مجاني"
            type: object
            fields:
              - name: ar
                label: "بالعربية"
                type: string
              - name: en
                label: "English"
                type: string
          - name: comingSoonLabel
            label: "وسم قريبًا"
            type: object
            fields:
              - name: ar
                label: "بالعربية"
                type: string
              - name: en
                label: "English"
                type: string
          - name: homeCard
            label: "كارت AI في الصفحة الرئيسية"
            type: object
            fields:
              - name: enabled
                label: "إظهار الكارت"
                type: boolean
              - name: index
                label: "الترتيب / الرقم"
                type: number
              - name: ar
                label: "اسم الكارت بالعربية"
                type: string
              - name: en
                label: "English card name"
                type: string
              - name: page
                label: "صفحة القسم"
                type: string
              - name: icon
                label: "الأيقونة / النص القصير"
                type: string
              - name: badgeAr
                label: "شارة الكارت بالعربية"
                type: string
              - name: badgeEn
                label: "Card badge English"
                type: string
              - name: thumbnails
                label: "صور معاينة الكارت"
                type: string
                list: true
          - name: items
            label: "أقسام وأدوات AI"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{order} · {ar} · {en}"
            fields:
              - name: id
                label: "ID"
                type: string
                required: true
              - name: order
                label: "الترتيب"
                type: number
              - name: icon
                label: "الأيقونة"
                type: string
              - name: ar
                label: "الاسم بالعربية"
                type: string
                required: true
              - name: en
                label: "English name"
                type: string
                required: true
              - name: descriptionAr
                label: "الوصف بالعربية"
                type: text
              - name: descriptionEn
                label: "English description"
                type: text
              - name: status
                label: "الحالة"
                type: select
                options:
                  values:
                    - name: comingSoon
                      label: "قريبًا"
                    - name: live
                      label: "متاح الآن"
              - name: url
                label: "الرابط عند التفعيل"
                type: string
                description: "اتركه فارغًا أثناء حالة قريبًا. عند التحويل إلى متاح ضع رابط HTTPS أو اسم صفحة داخلية."
              - name: enabled
                label: "إظهار العنصر"
                type: boolean
              - name: free
                label: "مجاني"
                type: boolean

  - name: features
    label: "الميزات والإعلانات"
    type: group
    items:
      - name: monetization
        label: "Random / Treasure / Ads"
        type: file
        path: monetization-config-v3.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schemaVersion
            label: "Schema Version"
            type: number
            readonly: true
          - name: revision
            label: "Revision"
            type: number
          - name: features
            label: "الميزات"
            type: object
            fields:
              - name: randomLibrary
                label: "Random Library"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل"
                    type: boolean
                  - name: avoidRepeatUntilPoolExhausted
                    label: "منع التكرار حتى انتهاء القائمة"
                    type: boolean
              - name: dailyTreasure
                label: "Daily Treasure"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل"
                    type: boolean
                  - name: requiresRewarded
                    label: "يتطلب Rewarded Ad"
                    type: boolean
                  - name: poolMode
                    label: "مصدر الأقسام"
                    type: select
                    options:
                      values:
                        - name: allEnabled
                          label: "كل الأقسام المفعلة"
                        - name: selected
                          label: "أقسام محددة"
                  - name: categoryIndexes
                    label: "أرقام الأقسام المحددة"
                    type: number
                    list: true
                  - name: maxRewardedUnlocksPerDay
                    label: "أقصى مرات الفتح يوميًا"
                    type: number
                    options:
                      min: 1
                      max: 100
                  - name: avoidRepeatUntilPoolExhausted
                    label: "منع تكرار الكنوز"
                    type: boolean
          - name: ads
            label: "الإعلانات"
            type: object
            fields:
              - name: enabled
                label: "تفعيل الإعلانات الحقيقية"
                type: boolean
              - name: banner
                label: "Banner"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل Banner"
                    type: boolean
              - name: interstitial
                label: "Interstitial"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل"
                    type: boolean
                  - name: everyNavigations
                    label: "بعد كل عدد تنقلات"
                    type: number
                    options:
                      min: 1
                      max: 30
                  - name: dailyCap
                    label: "الحد اليومي — 0 بدون حد"
                    type: number
                    options:
                      min: 0
                      max: 100
              - name: actionInterstitial
                label: "إعلانات الإجراءات"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل"
                    type: boolean
                  - name: everyActions
                    label: "إعلان بعد كل عدد إجراءات"
                    type: number
                    options:
                      min: 1
                      max: 20
                  - name: minSecondsBetweenAds
                    label: "أقل فاصل بالثواني"
                    type: number
                    options:
                      min: 0
                      max: 600
                  - name: showNotice
                    label: "إظهار تنبيه قبل الإعلان"
                    type: boolean
                  - name: actions
                    label: "الإجراءات التي تحتسب"
                    type: select
                    list: true
                    options:
                      values:
                        - name: view
                          label: "View"
                        - name: download
                          label: "Download"
                        - name: copy
                          label: "Copy"
                        - name: share
                          label: "Share"
              - name: rewarded
                label: "Rewarded"
                type: object
                fields:
                  - name: enabled
                    label: "تفعيل Rewarded"
                    type: boolean

  - name: notifications
    label: "الإشعارات Push"
    type: group
    items:
      - name: push_config
        label: "Firebase وإعداد الإرسال"
        type: file
        path: push-config.json
        format: json
        operations:
          create: false
          rename: false
          delete: false
        fields:
          - name: schemaVersion
            label: "Schema Version"
            type: number
            readonly: true
          - name: revision
            label: "Revision"
            type: number
          - name: enabled
            label: "تفعيل Push Notifications"
            type: boolean
          - name: firebase
            label: "Firebase Android Config"
            type: object
            fields:
              - name: appId
                label: "Firebase App ID — Release"
                type: string
                description: "للحزمة dlfatcom.buntyfrombengal.riyantalks"
              - name: debugAppId
                label: "Firebase App ID — Debug"
                type: string
                description: "اختياري للاختبار من Android Studio للحزمة dlfatcom.buntyfrombengal.riyantalks.debug"
              - name: apiKey
                label: "Firebase API Key"
                type: string
              - name: projectId
                label: "Firebase Project ID"
                type: string
              - name: senderId
                label: "Sender ID / Project Number"
                type: string
          - name: workerUrl
            label: "Cloudflare Worker URL"
            type: string
            description: "مثال: https://designlibrary-push.account.workers.dev"
          - name: defaultTopic
            label: "Default Topic"
            type: select
            options:
              values:
                - name: all
                  label: "كل المستخدمين"
                - name: lang_ar
                  label: "العربية"
                - name: lang_en
                  label: "English"
