media:
  input: cms-media
  output: /designlibrary/cms-media
  rename: safe
  categories:
  - image
settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: 'cms: update {path}'
      create: 'cms: create {path}'
      delete: 'cms: delete {path}'
      rename: 'cms: rename {oldPath} -> {newPath}'
content:
- name: content_hub
  label: الأقسام الرئيسية والمحتوى المجاني
  type: group
  items:
  - name: portal_config
    label: الأقسام الأساسية — الرئيسية
    type: file
    path: portal-config.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
    - name: schemaVersion
      label: Schema Version
      type: number
      readonly: true
    - name: revision
      label: Revision
      type: number
    - name: enabled
      label: تفعيل الصفحة الرئيسية
      type: boolean
    - name: brand
      label: اسم التطبيق
      type: object
      fields:
      - name: ar
        label: بالعربية
        type: string
      - name: en
        label: English
        type: string
    - name: title
      label: العنوان الرئيسي
      type: object
      fields:
      - name: ar
        label: بالعربية
        type: string
      - name: en
        label: English
        type: string
    - name: subtitle
      label: الوصف الرئيسي
      type: object
      fields:
      - name: ar
        label: بالعربية
        type: text
      - name: en
        label: English
        type: text
    - name: freeLabel
      label: شارة المجانية
      type: object
      fields:
      - name: ar
        label: بالعربية
        type: string
      - name: en
        label: English
        type: string
    - name: comingSoonMessage
      label: رسالة قريبًا
      type: object
      fields:
      - name: ar
        label: بالعربية
        type: text
      - name: en
        label: English
        type: text
    - name: sections
      label: الأقسام الأساسية
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{order} · {ar} · {en}'
      fields:
      - name: id
        label: ID — لا تغيّره
        type: string
        required: true
      - name: order
        label: الترتيب
        type: number
      - name: icon
        label: الأيقونة
        type: string
      - name: ar
        label: الاسم بالعربية
        type: string
        required: true
      - name: en
        label: English name
        type: string
        required: true
      - name: descriptionAr
        label: الوصف بالعربية
        type: text
      - name: descriptionEn
        label: English description
        type: text
      - name: status
        label: الحالة
        type: select
        options:
          values:
          - name: live
            label: مفتوح
          - name: comingSoon
            label: قريبًا
      - name: url
        label: رابط القسم
        type: string
      - name: enabled
        label: إظهار القسم
        type: boolean
      - name: target
        label: طريقة فتح القسم
        type: select
        options:
          values:
          - web
          - books
          - external
      - name: image
        label: صورة الكارت
        type: image
      - name: badgeAr
        label: شارة عربية
        type: string
      - name: badgeEn
        label: English badge
        type: string
    - name: showViews
      label: إظهار عداد المشاهدات
      type: boolean
    - name: theme
      label: ألوان الرئيسية
      type: object
      fields:
      - name: background
        label: background
        type: string
      - name: panel
        label: panel
        type: string
      - name: accent
        label: accent
        type: string
      - name: text
        label: text
        type: string
      - name: muted
        label: muted
        type: string
    - name: pages
      label: صفحات نصية داخل التطبيق
      type: object
      list: true
      fields:
      - name: id
        label: معرّف ثابت
        type: string
        required: true
      - name: ar
        label: العنوان بالعربية
        type: string
      - name: en
        label: English title
        type: string
      - name: bodyAr
        label: المحتوى العربي
        type: text
      - name: bodyEn
        label: English content
        type: text
      - name: enabled
        label: إظهار
        type: boolean
  - name: library_content
    label: إضافة المحتوى — كل الأقسام
    type: file
    path: library-content.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
    - name: schemaVersion
      label: Schema Version
      type: number
      readonly: true
    - name: revision
      label: Revision
      type: number
    - name: items
      label: المحتوى
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titleAr} · {section}'
      fields:
      - name: id
        label: ID فريد
        type: string
        required: true
      - name: section
        label: القسم
        type: select
        required: true
        options:
          values:
          - name: graphics
            label: جرافيك
          - name: courses
            label: كورسات
          - name: marketing
            label: تسويق
          - name: programs
            label: برامج
          - name: three-d
            label: ثري دي
          - name: books
            label: كتب
          - name: ai
            label: AI
          - name: other
            label: أخرى
      - name: order
        label: الترتيب داخل القسم
        type: number
      - name: titleAr
        label: العنوان بالعربية
        type: string
        required: true
      - name: titleEn
        label: English title
        type: string
        required: true
      - name: descriptionAr
        label: الوصف بالعربية
        type: text
      - name: descriptionEn
        label: English description
        type: text
      - name: image
        label: رابط صورة المعاينة HTTPS
        type: string
      - name: url
        label: رابط الفتح / المشاهدة
        type: string
      - name: downloadUrl
        label: رابط التحميل
        type: string
      - name: badgeAr
        label: شارة بالعربية
        type: string
      - name: badgeEn
        label: English badge
        type: string
      - name: enabled
        label: إظهار المحتوى
        type: boolean
- name: books_config
