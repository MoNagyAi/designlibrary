    - name: image
      label: صورة القسم
      type: image
    - name: items
      label: كتب تديرها من CMS — عند اختيار cms
      type: object
      list: true
      fields:
      - name: id
        label: معرّف فريد ثابت
        type: string
      - name: titleAr
        label: عنوان عربي
        type: string
      - name: titleEn
        label: English title
        type: string
      - name: descriptionAr
        label: وصف عربي
