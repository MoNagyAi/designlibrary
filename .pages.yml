    - name: enabled
      label: تفعيل Push Notifications
      type: boolean
    - name: firebase
      label: Firebase Android Config
      type: object
      fields:
      - name: appId
        label: Release App ID
        type: string
      - name: debugAppId
        label: Debug App ID
        type: string
      - name: apiKey
        label: API Key
        type: string
      - name: projectId
        label: Project ID
        type: string
      - name: senderId
        label: Sender ID
        type: string
    - name: workerUrl
      label: Cloudflare Worker URL
      type: string
    - name: defaultTopic
      label: Default Topic
      type: select
      options:
        values:
        - name: all
          label: كل المستخدمين
        - name: lang_ar
          label: العربية
        - name: lang_en
          label: English
