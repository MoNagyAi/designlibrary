- name: features
  label: الميزات والإعلانات
  type: group
  items:
  - name: monetization
    label: Random / Treasure / Ads
    type: file
    path: monetization-config-v3.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
    - name: schemaVersion
      label: Schema Version
      type: number
      readonly: true
    - name: revision
      label: Revision
      type: number
    - name: features
      label: الميزات
      type: object
      fields:
      - name: randomLibrary
        label: Random Library
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
        - name: avoidRepeatUntilPoolExhausted
          label: منع التكرار
          type: boolean
      - name: dailyTreasure
        label: Daily Treasure
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
        - name: requiresRewarded
          label: Rewarded مطلوب
          type: boolean
        - name: poolMode
          label: المصدر
          type: string
        - name: categoryIndexes
          label: أرقام الأقسام
          type: number
          list: true
        - name: maxRewardedUnlocksPerDay
          label: الحد اليومي
          type: number
        - name: avoidRepeatUntilPoolExhausted
          label: منع التكرار
          type: boolean
    - name: ads
      label: الإعلانات
      type: object
      fields:
      - name: enabled
        label: تفعيل الإعلانات الحقيقية
        type: boolean
      - name: banner
        label: Banner
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
      - name: interstitial
        label: Interstitial
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
        - name: everyNavigations
          label: بعد كل تنقلات
          type: number
        - name: dailyCap
          label: الحد اليومي
          type: number
      - name: actionInterstitial
        label: إعلانات الإجراءات
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
        - name: everyActions
          label: بعد كل إجراءات
          type: number
        - name: minSecondsBetweenAds
          label: الفاصل بالثواني
          type: number
        - name: showNotice
          label: إظهار تنبيه
          type: boolean
        - name: actions
          label: الإجراءات
          type: string
          list: true
      - name: rewarded
        label: Rewarded
        type: object
        fields:
        - name: enabled
          label: تفعيل
          type: boolean
- name: notifications
  label: الإشعارات Push
  type: group
  items:
