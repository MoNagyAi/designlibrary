<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البرامج | Software — Design Library</title><style>
:root{color-scheme:dark;font-family:Arial,Tahoma,sans-serif;color:#f7f4ec;background:#020b13}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:20px 14px 45px}nav{display:flex;justify-content:space-between;gap:12px}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a.action,nav a,select,input{border:1px solid #365063;border-radius:12px;padding:12px;background:#102333;color:#f7f4ec}button,a{cursor:pointer}h1{color:#efc25b;margin-bottom:10px}header p{color:#b3c4d1;line-height:1.7}.filters{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}input{flex:2;min-width:180px}select{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:stretch}.card{display:flex;flex-direction:column;min-width:0;border:1px solid #304758;border-radius:20px;overflow:hidden;background:#112333}.cover{height:100px;background:radial-gradient(ellipse at top,#234455,#081620);display:flex;align-items:center;justify-content:center;font-size:38px;color:#efc25b}.body{padding:16px;display:flex;flex-direction:column;flex:1}.group,.meta{font-size:12px;color:#adc1d0;line-height:1.6}.title{font-size:16px;line-height:1.6;overflow-wrap:anywhere;margin:10px 0}.views{display:flex;align-items:center;gap:7px;color:#efc25b;margin:12px 0;font-size:13px}.views svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}.actions{display:flex;gap:8px;margin-top:auto;padding-top:12px;flex-wrap:wrap}.actions a{flex:1;text-align:center;font-size:13px;font-weight:bold}.actions .open{background:#efc25b;color:#111}.actions .download{color:#8becd5;border-color:#278676}#more{display:block;margin:24px auto}#status{text-align:center;padding:14px;color:#b3c4d1}[hidden]{display:none!important}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:12px}.title{font-size:13px}.actions{flex-direction:column}.cover{height:85px;font-size:30px}}
</style></head><body><main><nav><a href="portal.html" id="back">← الأقسام الرئيسية</a><button id="language" type="button">English</button></nav><header><h1 id="heading">البرامج وأدوات التصميم</h1><p id="intro">تصفّح مجموعات البرامج وابحث باسم الملف. الملفات متعددة الأجزاء تظهر بأسمائها الأصلية.</p></header><div class="filters"><input type="search" id="search" aria-label="بحث / Search" placeholder="بحث باسم البرنامج أو الملف…"><select id="group" aria-label="المجموعة / Collection"></select></div><section class="grid" id="grid" aria-label="Software"></section><p id="status" role="status">جاري تحميل البرامج…</p><button id="more" hidden type="button">عرض المزيد / Load more</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let lang=new URLSearchParams(location.search).get('lang')||window.__dlLang||localStorage.getItem('dl-lang')||'ar',items=[],limit=24,base='https://designlibrary-books-api.profmohamedfat7i.workers.dev',generation=0;const counts=new Map(),nodes=new Map(),last=new Map(),pending=new Set();const ready=fetch('books-config.json',{cache:'no-store'}).then(r=>r.json()).then(c=>{if(c.proxyUrl&&new URL(c.proxyUrl).protocol==='https:')base=c.proxyUrl.replace(/\/$/,'')}).catch(()=>{});const en=()=>lang==='en';function el(tag,cls,text){const n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=text;return n}function label(id){for(const n of nodes.get(id)||[])n.textContent=counts.has(id)?new Intl.NumberFormat(en()?'en':'ar').format(counts.get(id)):'—'}function badge(x){const b=el('div','views');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';const n=el('span','','—');b.append(n,el('span','',en()?'views':'مشاهدة'));nodes.set(x.id,[...(nodes.get(x.id)||[]),n]);label(x.id);return b}async function track(x,action){const key=x.id+action;if(pending.has(key)||Date.now()-(last.get(key)||0)<3000)return;pending.add(key);last.set(key,Date.now());try{await ready;const r=await fetch(base+'/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,resourceId:x.id,resourceTitle:x.title,category:'Software',language:en()?'en':'ar'}),keepalive:true});const d=await r.json();if(r.ok&&d.ok&&action==='view'&&Number.isFinite(Number(d.count))){counts.set(x.id,Number(d.count));label(x.id)}}catch(e){}finally{pending.delete(key)}}function link(x,cls,title,url,action){const a=el('a',cls,title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.addEventListener('click',()=>track(x,action));return a}async function stats(shown,version){await ready;const ids=[...new Set(shown.map(x=>x.id))];for(let i=0;i<ids.length;i+=25){if(version!==generation)return;try{const r=await fetch(base+'/stats?ids='+encodeURIComponent(ids.slice(i,i+25).join(',')),{cache:'no-store'});if(!r.ok)continue;const d=await r.json();for(const row of d.records||[]){if(Number.isFinite(Number(row.views))){counts.set(row.id,Math.max(counts.get(row.id)||0,Number(row.views)));label(row.id)}}}catch(e){}}}function render(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';$('language').textContent=en()?'العربية':'English';$('back').textContent=en()?'← Main sections':'← الأقسام الرئيسية';$('heading').textContent=en()?'Software & Design Tools':'البرامج وأدوات التصميم';$('intro').textContent=en()?'Browse software collections and search by filename. Multi-part archives retain their original filenames.':'تصفّح مجموعات البرامج وابحث باسم الملف. الملفات متعددة الأجزاء تظهر بأسمائها الأصلية.';$('search').placeholder=en()?'Search software or files…':'بحث باسم البرنامج أو الملف…';const selected=$('group').value;$('group').replaceChildren(new Option(en()?'All collections':'كل المجموعات',''),...[...new Set(items.map(x=>x.group))].map(x=>new Option(x,x)));$('group').value=selected;const q=$('search').value.trim().toLowerCase(),filtered=items.filter(x=>(!selected||x.group===selected)&&(!q||(x.title+' '+x.folder+' '+x.group).toLowerCase().includes(q))),shown=filtered.slice(0,limit);$('grid').replaceChildren();nodes.clear();for(const x of shown){const card=el('article','card'),body=el('div','body');const cover=link(x,'cover','▣',x.url,'view');cover.setAttribute('aria-label',(en()?'View: ':'عرض: ')+x.title);const title=el('h2','title');title.append(link(x,'',x.title,x.url,'view'));body.append(el('div','group',x.group),title,el('div','meta',x.size),badge(x));const actions=el('div','actions');actions.append(link(x,'action open','عرض / View',x.url,'view'),link(x,'action download','تحميل / Download',x.downloadUrl,'download'));body.append(actions);card.append(cover,body);$('grid').append(card)}$('status').textContent=filtered.length?(en()?`Showing ${shown.length} of ${filtered.length} files`:`عرض ${shown.length} من ${filtered.length} ملف`):(en()?'No matching files.':'لا توجد ملفات مطابقة.');$('more').hidden=shown.length>=filtered.length;stats(shown,++generation)}$('language').onclick=()=>{lang=en()?'ar':'en';localStorage.setItem('dl-lang',lang);render()};$('search').oninput=()=>{limit=24;render()};$('group').onchange=()=>{limit=24;render()};$('more').onclick=()=>{limit+=24;render()};fetch('programs-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{items=d.items;render()}).catch(()=>{$('status').textContent=en()?'Unable to load files. Please refresh.':'تعذر تحميل الملفات. أعد تحديث الصفحة.'});})();
</script></body></html>
