<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البرامج | Software — Design Library</title><style>

.cover.software-art{height:auto;min-height:190px;aspect-ratio:16/10;position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px;overflow:hidden;background:radial-gradient(ellipse at 75% 0%,#203743,transparent 70%),linear-gradient(135deg,#101d2a,#040c13);border-bottom:1px solid #304758;font-size:14px;direction:ltr}.software-art:before{content:"";position:absolute;z-index:-1;width:180px;height:180px;border:1px solid var(--app-color);opacity:.13;border-radius:36px;transform:rotate(35deg);right:-65px;top:15px}.software-art:after{content:"";height:2px;background:var(--app-color);position:absolute;bottom:0;left:25%;right:25%;opacity:.7}.art-top,.art-bottom{width:100%;display:flex;align-items:center;gap:6px;min-height:18px}.art-top{justify-content:space-between}.art-brand{font-size:8px;letter-spacing:1.3px;color:#a9b4bb}.art-year{font-size:11px;color:#f4d78c}.app-symbol{display:flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:17px;border:2px solid var(--app-color);color:var(--app-color);background:#06111e;box-shadow:0 8px 22px #0005;font-size:34px;font-weight:700;letter-spacing:-1px}.app-symbol svg{width:45px;height:45px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.art-name{font-size:15px;font-weight:700;line-height:1.3;text-align:center;color:#edf1f5}.art-chip{font-size:9px;border:1px solid #42515c;border-radius:5px;padding:3px 5px;color:#c9d7df}.art-format{margin-left:auto;color:#91a4b1;font-size:9px;letter-spacing:1px}.software-art:hover .app-symbol{transform:translateY(-2px)}@media(max-width:560px){.cover.software-art{min-height:160px;padding:10px;gap:7px;aspect-ratio:auto}.app-symbol{width:58px;height:58px;font-size:28px;border-radius:14px}.art-name{font-size:12px}.art-brand{font-size:6px;letter-spacing:.5px}.art-year{font-size:10px}.art-chip{font-size:8px}}
</style></head><body><main><nav><a href="portal.html" id="back">← الأقسام الرئيسية</a><button id="language" type="button">English</button></nav><header><h1 id="heading">البرامج وأدوات التصميم</h1><p id="intro">تصفّح مجموعات البرامج وابحث باسم الملف. الملفات متعددة الأجزاء تظهر بأسمائها الأصلية.</p></header><div class="filters"><input type="search" id="search" aria-label="بحث / Search" placeholder="بحث باسم البرنامج أو الملف…"><select id="group" aria-label="المجموعة / Collection"></select></div><section class="grid" id="grid" aria-label="Software"></section><p id="status" role="status">جاري تحميل البرامج…</p><button id="more" hidden type="button">عرض المزيد / Load more</button></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let lang=new URLSearchParams(location.search).get('lang')||window.__dlLang||localStorage.getItem('dl-lang')||'ar',items=[],limit=24,base='https://designlibrary-books-api.profmohamedfat7i.workers.dev',generation=0;const counts=new Map(),nodes=new Map(),last=new Map(),pending=new Set();const ready=fetch('books-config.json',{cache:'no-store'}).then(r=>r.json()).then(c=>{if(c.proxyUrl&&new URL(c.proxyUrl).protocol==='https:')base=c.proxyUrl.replace(/\/$/,'')}).catch(()=>{});const en=()=>lang==='en';function el(tag,cls,text){const n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=text;return n}function label(id){for(const n of nodes.get(id)||[])n.textContent=counts.has(id)?new Intl.NumberFormat(en()?'en':'ar').format(counts.get(id)):'—'}function badge(x){const b=el('div','views');b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';const n=el('span','','—');b.append(n,el('span','',en()?'views':'مشاهدة'));nodes.set(x.id,[...(nodes.get(x.id)||[]),n]);label(x.id);return b}async function track(x,action){const key=x.id+action;if(pending.has(key)||Date.now()-(last.get(key)||0)<3000)return;pending.add(key);last.set(key,Date.now());try{await ready;const r=await fetch(base+'/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,resourceId:x.id,resourceTitle:x.title,category:'Software',language:en()?'en':'ar'}),keepalive:true});const d=await r.json();if(r.ok&&d.ok&&action==='view'&&Number.isFinite(Number(d.count))){counts.set(x.id,Number(d.count));label(x.id)}}catch(e){}finally{pending.delete(key)}}function link(x,cls,title,url,action){const a=el('a',cls,title);a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.addEventListener('click',()=>track(x,action));return a}async function stats(shown,version){await ready;const ids=[...new Set(shown.map(x=>x.id))];for(let i=0;i<ids.length;i+=25){if(version!==generation)return;try{const r=await fetch(base+'/stats?ids='+encodeURIComponent(ids.slice(i,i+25).join(',')),{cache:'no-store'});if(!r.ok)continue;const d=await r.json();for(const row of d.records||[]){if(Number.isFinite(Number(row.views))){counts.set(row.id,Math.max(counts.get(row.id)||0,Number(row.views)));label(row.id)}}}catch(e){}}}
function softwareArtwork(x){

const rules=[

];let r=rules.find(r=>r[0].test(name)||r[0].test(raw))||[null,'APP','برنامج / ملف','Software / File','#efc25b'];
const a=link(x,'cover software-art','',x.url,'view');a.style.setProperty('--app-color',r[4]);a.setAttribute('aria-label',(en()?'View: ':'عرض: ')+x.title);
const top=el('div','art-top');top.append(el('span','art-brand','MONAGY • SOFTWARE'));
const year=name.match(/(?:^|[^0-9])(20(?:1[0-9]|2[0-9]))(?=[^0-9]|$)/);if(year)top.append(el('span','art-year',year[1]));

const ext=raw.match(/\.([a-z0-9]{2,5})$/i);if(ext)bottom.append(el('span','art-format',ext[1].toUpperCase()));
a.append(top,icon,title,bottom);return a;
}

function render(){document.documentElement.lang=en()?'en':'ar';document.documentElement.dir=en()?'ltr':'rtl';$('language').textContent=en()?'العربية':'English';$('back').textContent=en()?'← Main sections':'← الأقسام الرئيسية';$('heading').textContent=en()?'Software & Design Tools':'البرامج وأدوات التصميم';$('intro').textContent=en()?'Browse software collections and search by filename. Multi-part archives retain their original filenames.':'تصفّح مجموعات البرامج وابحث باسم الملف. الملفات متعددة الأجزاء تظهر بأسمائها الأصلية.';$('search').placeholder=en()?'Search software or files…':'بحث باسم البرنامج أو الملف…';const selected=$('group').value;$('group').replaceChildren(new Option(en()?'All collections':'كل المجموعات',''),...[...new Set(items.map(x=>x.group))].map(x=>new Option(x,x)));$('group').value=selected;const q=$('search').value.trim().toLowerCase(),filtered=items.filter(x=>(!selected||x.group===selected)&&(!q||(x.title+' '+x.folder+' '+x.group).toLowerCase().includes(q))),shown=filtered.slice(0,limit);$('grid').replaceChildren();nodes.clear();for(const x of shown){const card=el('article','card'),body=el('div','body');const cover=softwareArtwork(x);const title=el('h2','title');title.append(link(x,'',x.title,x.url,'view'));body.append(el('div','group',x.group),title,el('div','meta',x.size),badge(x));const actions=el('div','actions');actions.append(link(x,'action open','عرض / View',x.url,'view'),link(x,'action download','تحميل / Download',x.downloadUrl,'download'));body.append(actions);card.append(cover,body);$('grid').append(card)}$('status').textContent=filtered.length?(en()?`Showing ${shown.length} of ${filtered.length} files`:`عرض ${shown.length} من ${filtered.length} ملف`):(en()?'No matching files.':'لا توجد ملفات مطابقة.');$('more').hidden=shown.length>=filtered.length;stats(shown,++generation)}$('language').onclick=()=>{lang=en()?'ar':'en';localStorage.setItem('dl-lang',lang);render()};$('search').oninput=()=>{limit=24;render()};$('group').onchange=()=>{limit=24;render()};$('more').onclick=()=>{limit+=24;render()};fetch('programs-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{items=d.items;render()}).catch(()=>{$('status').textContent=en()?'Unable to load files. Please refresh.':'تعذر تحميل الملفات. أعد تحديث الصفحة.'});})();
