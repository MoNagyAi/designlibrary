<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تطبيقات محمد ناجي | Mohamed Nagy Apps</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131f;color:#edf3fa;font:15px/1.7 Arial,sans-serif}main{max-width:1080px;margin:auto;padding:24px 18px}nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}a{color:#f2c861}button,.launch{padding:11px 18px;border:1px solid #c4a254;border-radius:10px;background:#efc25b;color:#102030;font:700 14px Arial;cursor:pointer;text-decoration:none;display:inline-block}h1{margin:0;font-size:28px}.intro{color:#adbfd0;margin:8px 0 24px}#apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:stretch}.app{display:flex;flex-direction:column;height:100%;min-width:0;border:1px solid #344858;border-radius:18px;overflow:hidden;background:#102233}.cover{background:#050c13;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;overflow:hidden}.cover img{display:block;width:100%;height:100%;object-fit:contain}.content{padding:16px;display:flex;flex-direction:column;flex:1}h2{font-size:18px;line-height:1.45;margin:9px 0}.original{font-size:13px;color:#b6c6d4;direction:ltr;text-align:left;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:4.35em}.summary{color:#d8e2eb;font-size:13px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;min-height:4.95em}.tag{font-size:12px;color:#73ddce}.notice{padding:10px;border:1px solid #b28d4055;border-radius:10px;color:#ead8ac;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:14px}.share{background:transparent;color:#efc25b}ol{padding-inline-start:22px}#shareResult{overflow-wrap:anywhere;color:#aec9d9;font-size:12px}footer{color:#91a6b9;font-size:12px;margin-top:20px}@media(max-width:650px){#apps{grid-template-columns:1fr 1fr;gap:10px}main{padding:18px 10px}.content{padding:12px}h1{font-size:24px}h2{font-size:15px}.original{font-size:12px}.summary{font-size:12px}.launch,button{padding:9px 10px;font-size:12px}}@media(max-width:390px){#apps{grid-template-columns:1fr}}
.app.cover:focus-visible,.app-title-link:focus-visible{outline:3px solid #efc25b;outline-offset:-3px}.app-title-link{color:inherit;text-decoration:none}.app-title-link:hover{color:#efc25b}.cover img{transition:transform .2s}.cover:hover img{transform:scale(1.015)}details{margin-top:16px}summary{cursor:pointer;color:#efc25b;font-weight:bold}.share-result{overflow-wrap:anywhere;font-size:12px;color:#a9c5d7}.cover{overflow:hidden}</style></head><body><main><nav><a href="ai-hub.html" id="back"></a><button type="button" id="language"></button></nav><h1 id="heading"></h1><p class="intro" id="intro"></p><div id="apps"></div><footer id="source"></footer></main><script>
(()=>{let apps=[];const $=id=>document.getElementById(id);let lang='ar';try{lang=(window.__dlLang||localStorage.getItem('dl-language')||'ar').startsWith('en')?'en':'ar'}catch(e){}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function link(cls,url){const a=el('a',cls);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){const en=lang==='en';document.documentElement.lang=lang;document.documentElement.dir=en?'ltr':'rtl';$('back').textContent=en?'← AI Creative Hub':'← مركز الذكاء الاصطناعي';$('language').textContent=en?'العربية':'English';$('heading').textContent=en?'Mohamed Nagy Apps':'تطبيقات محمد ناجي';$('intro').textContent=en?'Select any app image, title or Open app button to launch it on RunningHub.':'اضغط على صورة التطبيق أو عنوانه أو زر فتح التطبيق للانتقال مباشرة إلى RunningHub.';$('source').textContent=en?'Original thumbnails and titles from RunningHub. Links include the creator’s invitation code.':'الصور والعناوين الأصلية من RunningHub. الروابط تتضمن كود دعوة صاحب التطبيقات.';$('apps').replaceChildren();
apps.forEach(app=>{const card=el('article','app'),cover=link('cover',app.url),img=el('img');img.src=app.image;img.alt=app.title;img.loading='lazy';img.referrerPolicy='no-referrer';cover.setAttribute('aria-label',(en?'Open app: ':'فتح التطبيق: ')+app.title);cover.append(img);const content=el('div','content');content.append(el('span','tag','RunningHub · Mohamed Nagy'));const titleLink=link('app-title-link',app.url);titleLink.append(el('h2','original',app.title));content.append(titleLink);const summary=en?(app.descriptionEn||app.en||''):(app.descriptionAr||app.ar||'');if(summary)content.append(el('p','summary',summary));const details=el('details');details.append(el('summary','',en?'How to use':'طريقة الاستخدام'));const list=el('ol');(en?app.stepsEn:app.stepsAr).forEach(s=>list.append(el('li','',s)));details.append(list);content.append(details,el('p','notice',en?'Links and guides here are free. RunningHub execution may require credits; review the cost before running.':'الروابط والشرح هنا مجانيان. التشغيل على RunningHub قد يتطلب رصيدًا؛ راجع التكلفة قبل التشغيل.'));const actions=el('div','actions'),launch=link('launch',app.url);launch.textContent=en?'Open app ↗':'فتح التطبيق ↗';const share=el('button','share',en?'Copy share link':'نسخ رابط المشاركة');share.type='button';const result=el('p','share-result');result.setAttribute('role','status');share.onclick=async()=>{try{await navigator.clipboard.writeText(app.url);result.textContent=en?'Link copied.':'تم نسخ الرابط.'}catch(e){result.textContent=app.url}};actions.append(launch,share);content.append(actions,result);card.append(cover,content);$('apps').append(card)})}
$('language').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('dl-language',lang)}catch(e){}render()};window.DesignLibraryAiSetLanguage=next=>{lang=String(next).startsWith('en')?'en':'ar';render()};fetch('ai-config.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('load');return r.json()}).then(cfg=>{apps=(cfg.items||[]).filter(x=>x.id&&x.id.startsWith('runninghub-')&&x.enabled!==false).sort((a,b)=>(a.order||999)-(b.order||999)).map(x=>({id:x.id,title:x.originalTitle||x.en,ar:x.ar,en:x.en,descriptionAr:x.descriptionAr,descriptionEn:x.descriptionEn,image:x.image,url:x.url,stepsAr:String(x.instructionsAr||'').split('\n').filter(Boolean),stepsEn:String(x.instructionsEn||'').split('\n').filter(Boolean)}));render()}).catch(()=>{$('intro').textContent=lang==='en'?'Unable to load apps. Please retry.':'تعذر تحميل التطبيقات. أعد المحاولة.'});render()})();
</script></body></html>
