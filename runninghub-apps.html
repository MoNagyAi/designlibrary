<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تطبيقات محمد ناجي | Mohamed Nagy Apps</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131f;color:#edf3fa;font:15px/1.7 Arial,sans-serif}main{max-width:1200px;margin:auto;padding:22px 14px}nav{display:flex;justify-content:space-between;gap:12px;margin-bottom:24px}a{color:#f2c861}button,.launch{padding:11px 18px;border:1px solid #c4a254;border-radius:10px;background:#efc25b;color:#102030;font:700 14px Arial;cursor:pointer;text-decoration:none;display:inline-block}h1{margin:0;font-size:28px}.intro{color:#adbfd0;margin:8px 0 24px}.usage-login{margin:12px 0;padding:12px;border:1px solid #3e6175;border-radius:14px;background:#0b2032}.usage-login strong{display:block;color:#f2c861;margin-bottom:6px;font-size:13px}.usage-login p{margin:0 0 9px;color:#d5e0e8;font-size:12px;line-height:1.7}.usage-login-link{display:block;text-align:center;padding:10px 12px;border-radius:10px;background:#efc25b;color:#102030!important;font-weight:700;text-decoration:none;font-size:12px}.usage-safe{display:block;margin-top:8px;color:#7ce3d8;font-size:11px;line-height:1.6}#apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:stretch;grid-auto-rows:1fr}.app{display:flex;flex-direction:column;height:100%;min-width:0;border:1px solid #344858;border-radius:22px;overflow:hidden;background:#102233}.cover{background:#050c13;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;overflow:hidden;padding:8px}.cover img{display:block;width:100%;height:100%;object-fit:contain;border-radius:14px}.content{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}h2{font-size:18px;line-height:1.4;margin:4px 0}.title-ar{direction:rtl;text-align:right;color:#f4f6f8;margin-bottom:4px}.original{font-size:12px;color:#b6c6d4;direction:ltr;text-align:left;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:0}.notice{padding:10px;border:1px solid #b28d4055;border-radius:10px;color:#ead8ac;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-top:2px}.launch{flex:1 1 100%;text-align:center;font-size:16px}.share{background:transparent;color:#efc25b}ol{padding-inline-start:22px}#shareResult{overflow-wrap:anywhere;color:#aec9d9;font-size:12px}footer{color:#91a6b9;font-size:12px;margin-top:20px}@media(max-width:650px){#apps{grid-template-columns:1fr 1fr;gap:12px}main{padding:16px 8px}.content{padding:12px}.cover{padding:5px}h1{font-size:24px}h2{font-size:15px}.original{font-size:12px}.summary{font-size:12px;min-height:0}.launch,button{padding:10px 9px;font-size:13px}}@media(max-width:390px){#apps{grid-template-columns:1fr}}
.cover:focus-visible,.app-title-link:focus-visible{outline:3px solid #efc25b;outline-offset:-3px}.app-title-link{color:inherit;text-decoration:none}.app-title-link:hover{color:#efc25b}.cover img{transition:transform .2s}.cover:hover img{transform:scale(1.015)}details{margin-top:10px}summary{cursor:pointer;color:#efc25b;font-weight:bold}.share-result{overflow-wrap:anywhere;font-size:12px;color:#a9c5d7}.cover{overflow:hidden}.app-views{display:flex;align-items:center;gap:6px;color:#a9c5d7;font-size:12px;margin:8px 0 4px;min-height:22px}.app-views svg{width:19px;height:19px;fill:none;stroke:#efc25b;stroke-width:1.7;flex:none}.view-number{font-variant-numeric:tabular-nums;font-weight:700;color:#f2d58d}</style></head><body><main><nav><a href="portal.html" id="back"></a><button type="button" id="language"></button></nav><h1 id="heading"></h1><p class="intro" id="intro"></p><div id="apps"></div><footer id="source"></footer></main><script>
(()=>{let apps=[];const $=id=>document.getElementById(id);let lang='ar';try{lang=(window.__dlLang||localStorage.getItem('dl-language')||'ar').startsWith('en')?'en':'ar'}catch(e){}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}
function link(cls,url){const a=el('a',cls);a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.addEventListener('click',()=>recordAppView(url));return a}
const viewCounts=new Map(),viewNodes=new Map(),viewPending=new Set(),viewLastClick=new Map();
let viewsBase='https://designlibrary-books-api.profmohamedfat7i.workers.dev';
const viewsReady=fetch('books-config.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(c=>{if(c.proxyUrl&&new URL(c.proxyUrl).protocol==='https:')viewsBase=c.proxyUrl.replace(/\/$/,'')}).catch(()=>{});
function viewId(app){const m=String(app.url||'').match(/ai-detail\/(\d+)/);return m?'res_runninghub'+m[1]:null}
function updateViewLabel(id){const node=viewNodes.get(id);if(!node)return;const count=viewCounts.get(id);node.textContent=count===undefined?'—':new Intl.NumberFormat(lang==='en'?'en':'ar').format(count);node.parentElement.title=count===undefined?(lang==='en'?'Views unavailable':'عدد المشاهدات غير متاح'):(lang==='en'?'App opens':'مرات فتح التطبيق');}
function viewBadge(app){const badge=el('div','app-views');badge.setAttribute('aria-live','polite');const eye=document.createElementNS('http://www.w3.org/2000/svg','svg');eye.setAttribute('viewBox','0 0 24 24');eye.setAttribute('aria-hidden','true');eye.innerHTML='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';const n=el('span','view-number','—');badge.append(eye,n,el('span','',lang==='en'?'views':'مشاهدة'));const id=viewId(app);if(id){viewNodes.set(id,n);updateViewLabel(id)}return badge;}
async function loadViewCounts(){await viewsReady;const ids=[...new Set(apps.map(viewId).filter(Boolean))];for(let i=0;i<ids.length;i+=25){try{const r=await fetch(viewsBase+'/stats?ids='+encodeURIComponent(ids.slice(i,i+25).join(',')),{cache:'no-store'});if(!r.ok)continue;const data=await r.json();for(const row of data.records||[]){if(Number.isFinite(Number(row.views))){viewCounts.set(row.id,Math.max(viewCounts.get(row.id)||0,Number(row.views)));updateViewLabel(row.id)}}}catch(e){}}}
async function recordAppView(url){const app=apps.find(x=>x.url===url);if(!app)return;const id=viewId(app);if(!id||viewPending.has(id)||Date.now()-(viewLastClick.get(id)||0)<3000)return;viewPending.add(id);viewLastClick.set(id,Date.now());try{await viewsReady;const r=await fetch(viewsBase+'/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'view',resourceId:id,resourceTitle:app.title,category:'AI Apps',language:lang}),keepalive:true});if(!r.ok)throw Error('views');const data=await r.json();if(data.ok&&Number.isFinite(Number(data.count))){viewCounts.set(id,Number(data.count));updateViewLabel(id)}}catch(e){}finally{viewPending.delete(id)}}
function shareUrl(x){const raw=String(x?.url||'');let id=String(x?.id||'').replace(/^runninghub-/,'');const m=raw.match(/(?:ai-detail|webapp)\/(\d+)/);if(m)id=m[1];return id?`https://www.runninghub.ai/ai-detail/${id}?inviteCode=qfviaawx`:raw}
function render(){const en=lang==='en';document.documentElement.lang=lang;document.documentElement.dir=en?'ltr':'rtl';$('back').textContent=en?'← Main Categories':'← الأقسام الرئيسية';$('language').textContent=en?'العربية':'English';$('heading').textContent=en?'AI Apps — Works on Phone or Computer':'تطبيقات الذكاء الاصطناعي تعمل من الهاتف أو الكمبيوتر';$('intro').textContent=en?'Select any app image, title or Open app button to launch it on RunningHub.':'اضغط على صورة التطبيق أو عنوانه أو زر فتح التطبيق للانتقال مباشرة إلى RunningHub.';$('source').textContent=en?'Original thumbnails and titles from RunningHub. Links include the creator’s invitation code.':'الصور والعناوين الأصلية من RunningHub. الروابط تتضمن كود دعوة صاحب التطبيقات.';$('apps').replaceChildren();viewNodes.clear();
apps.forEach(app=>{const card=el('article','app'),cover=link('cover',app.url),img=el('img');img.src=app.image;img.alt=app.title;img.loading='lazy';img.referrerPolicy='no-referrer';cover.setAttribute('aria-label',(en?'Open app: ':'فتح التطبيق: ')+app.title);cover.append(img);const content=el('div','content');const titleLink=link('app-title-link',app.url);const arTitle=el('h2','title-ar',app.ar||app.title),enTitle=el('div','original',app.title);titleLink.append(arTitle,enTitle);content.append(titleLink,viewBadge(app));const details=el('details');details.append(el('summary','',en?'How to use':'طريقة الاستخدام'));
const loginBox=el('div','usage-login');
loginBox.append(el('strong','',en?'🔐 Safe RunningHub sign-in':'🔐 تسجيل الدخول الآمن إلى RunningHub'));
loginBox.append(el('p','',en?'Open this app on the official RunningHub website in your external browser, then sign in there only. Never enter your RunningHub email or password inside Design Library.':'افتح هذا التطبيق على موقع RunningHub الرسمي في المتصفح الخارجي، ثم سجّل الدخول هناك فقط. لا تُدخل بريدك الإلكتروني أو كلمة مرور RunningHub داخل تطبيق مكتبة التصميم.'));
const loginLink=link('usage-login-link',app.url);loginLink.textContent=en?'Open RunningHub with referral link ↗':'فتح RunningHub برابط الإحالة ↗';
loginBox.append(loginLink,el('small','usage-safe',en?'This is the app share link and includes Mohamed Nagy referral code: qfviaawx.':'هذا هو رابط الشير الخاص بالتطبيق ويتضمن كود الإحالة الخاص بمحمد ناجي: qfviaawx.'));
details.append(loginBox);
const list=el('ol');(en?app.stepsEn:app.stepsAr).forEach(s=>list.append(el('li','',s)));details.append(list);const actions=el('div','actions'),launch=link('launch',app.url);launch.textContent=en?'Open app ↗':'فتح التطبيق ↗';const share=el('button','share',en?'Copy share link':'نسخ رابط المشاركة');share.type='button';const result=el('p','share-result');result.setAttribute('role','status');share.onclick=async()=>{try{await navigator.clipboard.writeText(app.url);result.textContent=en?'Link copied.':'تم نسخ الرابط.'}catch(e){result.textContent=app.url}};actions.append(launch,share);content.append(actions,result,details);card.append(cover,content);$('apps').append(card)})}
$('language').onclick=()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('dl-language',lang)}catch(e){}render()};window.DesignLibraryAiSetLanguage=next=>{lang=String(next).startsWith('en')?'en':'ar';render()};
async function loadApps(){try{
const stamp=Date.now();
const [catalog,cfg]=await Promise.all([
fetch('runninghub-apps-data.json?t='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('catalog');return r.json()}),
fetch('ai-config.json?t='+stamp,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('config');return r.json()})
]);
const manual=(cfg.items||[]).filter(x=>x.id&&x.id.startsWith('runninghub-'));
const overrides=new Map(manual.map(x=>[x.id,x]));
const seen=new Set();
const remote=(catalog.apps||[]).filter(x=>x.id&&x.enabled!==false).map(x=>{
const o=overrides.get(x.id)||{};seen.add(x.id);
return {id:x.id,order:x.order||o.order||999,title:x.originalTitle||x.en||x.ar,ar:o.ar||x.ar||x.originalTitle,en:o.en||x.en||x.originalTitle,descriptionAr:x.descriptionAr||o.descriptionAr||'',descriptionEn:x.descriptionEn||o.descriptionEn||'',image:x.image||o.image||'',url:shareUrl(x),stepsAr:String(o.instructionsAr||x.instructionsAr||'').split('\n').filter(Boolean),stepsEn:String(o.instructionsEn||x.instructionsEn||'').split('\n').filter(Boolean)}
});
const manualOnly=manual.filter(x=>x.enabled!==false&&!seen.has(x.id)).map(x=>({id:x.id,order:x.order||999,title:x.originalTitle||x.en||x.ar,ar:x.ar,en:x.en,descriptionAr:x.descriptionAr||'',descriptionEn:x.descriptionEn||'',image:x.image||'',url:shareUrl(x),stepsAr:String(x.instructionsAr||'').split('\n').filter(Boolean),stepsEn:String(x.instructionsEn||'').split('\n').filter(Boolean)}));
apps=[...remote,...manualOnly].sort((a,b)=>(a.order||999)-(b.order||999));render();loadViewCounts();
}catch(e){
fetch('ai-config.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(cfg=>{apps=(cfg.items||[]).filter(x=>x.id&&x.id.startsWith('runninghub-')&&x.enabled!==false).sort((a,b)=>(a.order||999)-(b.order||999)).map(x=>({id:x.id,order:x.order||999,title:x.originalTitle||x.en||x.ar,ar:x.ar,en:x.en,descriptionAr:x.descriptionAr||'',descriptionEn:x.descriptionEn||'',image:x.image||'',url:shareUrl(x),stepsAr:String(x.instructionsAr||'').split('\n').filter(Boolean),stepsEn:String(x.instructionsEn||'').split('\n').filter(Boolean)}));render();loadViewCounts()}).catch(()=>{$('intro').textContent=lang==='en'?'Unable to load apps. Please retry.':'تعذر تحميل التطبيقات. أعد المحاولة.';render()});
}}
loadApps()})();
</script></body></html>
