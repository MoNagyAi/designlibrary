<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة الكتب والمراجع | Books & References</title>
<style>
:root{color-scheme:dark;--gold:#edc65e;--text:#edf2f6;--line:#344b5b}*{box-sizing:border-box}body{margin:0;background:#06121d;color:var(--text);font-family:Arial,Tahoma,sans-serif}main{width:100%;padding:22px clamp(12px,3vw,48px)}nav{display:flex;justify-content:space-between;gap:12px}a,button{color:var(--gold)}button,.btn{cursor:pointer;border:1px solid #a88a43;background:#102333;border-radius:12px;padding:12px 17px;font:700 15px Arial;text-decoration:none}button:hover,.btn:hover{background:#263e50}header{margin:25px 0}h1{font-size:clamp(24px,3vw,34px);margin:0 0 10px}p{line-height:1.8;color:#b7c5cf}.notice{font-size:12px;border-inline-start:3px solid var(--gold);padding:10px 15px;background:#211e15}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.category{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:22px;border:1px solid #8b743f;border-radius:20px;background:#0d1d2b;text-align:center}.category strong{font-size:20px;line-height:1.5}.category small{color:#aabcc8;line-height:1.5}.num{border:1px solid var(--gold);border-radius:15px;padding:7px 12px;color:var(--gold)}article{overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:#102333}.cover{height:230px;display:flex;align-items:center;justify-content:center;background:#081722;color:var(--gold);font-size:75px}.cover img{width:100%;height:100%;object-fit:contain}.body{padding:18px;display:flex;flex-direction:column;flex:1;gap:12px}.body h2{font-size:18px;line-height:1.6;margin:0}.body p{font-size:13px;margin:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.primary{background:var(--gold);color:#102333}.views{color:var(--gold);font-size:13px}.views svg{width:19px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;margin-inline-end:5px}.filters{display:flex;gap:10px;margin:20px 0}input{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:#102333;color:white;font-size:16px}#status{text-align:center}#more{display:block;margin:24px auto}#more[hidden]{display:none}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.category{padding:13px;min-height:180px}.category strong{font-size:16px}.cover{height:185px}.body{padding:12px}.body h2{font-size:15px}.btn{padding:10px;font-size:13px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><main><nav><a id="back" class="btn" href="https://monagy-designlibrary.github.io/" target="_top">← الأقسام الرئيسية / Home</a><button id="language">English</button></nav><header><h1 id="title">مكتبة الكتب والمراجع</h1><p id="intro"></p></header><p class="notice">للأغراض التعليمية فقط. حقوق الكتب محفوظة للمؤلفين والناشرين؛ يُرجى الالتزام بتراخيصهم.<br><span lang="en" dir="ltr">For educational use only. Copyright belongs to the authors and publishers; follow their license terms.</span></p><div class="filters"><input id="search" type="search" aria-label="بحث / Search"></div><section id="grid" class="grid"></section><p id="status" role="status">جاري التحميل…</p><button id="more" hidden>عرض المزيد / Load more</button></main><script>
'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let lang=q.get('lang')==='en'?'en':'ar',cfg,categories=[],selected=null,records=[],offset='',busy=false,request=0;const en=()=>lang==='en',eye='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
function el(tag,cls,text){const n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=text;return n}
function safe(v){if(typeof v!=='string')return '';try{const u=new URL(v.trim());return u.protocol==='https:'||u.protocol==='http:'?u.href:''}catch{return ''}}
function urlOf(f){for(const value of [f.url,f.URL,f.link,f.Link,f.subtitle]){const url=safe(value);if(url)return url}return ''}
function title(c){return en()?(c.en||c.ar):(c.ar||c.en)}
function status(t){$('status').textContent=t}
function render(){
document.documentElement.lang=lang;document.documentElement.dir=en()?'ltr':'rtl';$('language').textContent=en()?'العربية':'English';
$('title').textContent=selected?title(selected):(en()?'Books & References':'مكتبة الكتب والمراجع');
$('intro').textContent=selected?(en()?'Open a book to read it or download it from its original source.':'افتح الكتاب لقراءته أو تحميله من مصدره الأصلي.'):(en()?categories.length+' categories, synced with the app.':categories.length+' قسمًا، بنفس تقسيمات التطبيق.');
$('search').placeholder=selected?(en()?'Search loaded books…':'ابحث في الكتب المحمّلة…'):(en()?'Search categories…':'ابحث عن قسم…');
$('back').textContent=selected?(en()?'← Book categories':'← أقسام الكتب'):'← الأقسام الرئيسية / Home';
const term=$('search').value.trim().toLowerCase(),grid=$('grid');grid.replaceChildren();
if(!selected){for(const c of categories.filter(c=>(c.ar+' '+c.en).toLowerCase().includes(term))){const b=el('button','category');b.append(el('span','num',String(categories.indexOf(c)+1).padStart(2,'0')+' / '+categories.length),el('strong','',title(c)),el('small','',en()?c.ar:c.en));b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('category',c.id);u.searchParams.set('lang',lang);history.pushState({},'',u);openCategory(c.id)};grid.append(b)}status(grid.children.length?'':(en()?'No categories found.':'لا توجد أقسام مطابقة.'));$('more').hidden=true;return}
let shown=0;for(const r of records){const f=r.fields||r,t=String(f.title||f.Title||f.name||'Book');if(!t.toLowerCase().includes(term))continue;shown++;const card=el('article'),cover=el('div','cover','📖'),body=el('div','body'),url=urlOf(f);let image=Array.isArray(f.image)?safe(f.image[0]?.url):safe(f.image);if(image){cover.textContent='';const im=el('img');im.src=image;im.alt=t;im.loading='lazy';im.onerror=()=>{cover.textContent='📖'};cover.append(im)}body.append(el('h2','',t));if(f.subtitle&&!safe(f.subtitle))body.append(el('p','',String(f.subtitle)));const v=el('div','views'),count=f.Views??f.views??f.ViewsCount;v.innerHTML=eye;v.append(document.createTextNode((count===undefined?'—':String(count))+' '+(en()?'views':'مشاهدة')));body.append(v);const actions=el('div','actions');if(url){const a=el('a','btn primary','عرض / View');a.href=url;a.target='_blank';a.rel='noopener noreferrer';actions.append(a);const m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);if(m){const d=el('a','btn','تحميل / Download');d.href='https://drive.google.com/uc?export=download&id='+encodeURIComponent(m[1]);d.target='_blank';d.rel='noopener noreferrer';actions.append(d)}}else actions.append(el('p','',en()?'Source link unavailable.':'رابط المصدر غير متاح.'));body.append(actions);card.append(cover,body);grid.append(card)}
$('more').hidden=!offset;$('more').disabled=busy;status(busy?(en()?'Loading…':'جاري التحميل…'):(shown?(en()?shown+' books shown':'عرض '+shown+' كتاب'):(en()?'No books found.':'لا توجد كتب مطابقة.')));
}
async function loadMore(){if(busy||!selected)return;const version=request;busy=true;render();try{const u=new URL(cfg.proxyUrl.replace(/\/$/,'')+'/books');u.searchParams.set('category',selected.id);if(offset)u.searchParams.set('offset',offset);const response=await fetch(u,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.records))throw Error('Invalid response');if(version!==request)return;const ids=new Set(records.map(r=>r.id));records.push(...data.records.filter(r=>!ids.has(r.id)));offset=data.offset||'';busy=false;render()}catch(e){if(version!==request)return;busy=false;render();status(en()?'Unable to load books. Please try again.':'تعذر تحميل الكتب. حاول مرة أخرى.');$('more').hidden=false;$('more').disabled=false}}
function openCategory(id){request++;selected=categories.find(c=>c.id===id)||null;records=[];offset='';busy=false;$('search').value='';render();if(selected)loadMore()}
$('search').oninput=render;$('more').onclick=loadMore;$('language').onclick=()=>{lang=en()?'ar':'en';render()};$('back').onclick=e=>{if(selected){e.preventDefault();const u=new URL(location.href);u.searchParams.delete('category');history.pushState({},'',u);openCategory(null)}};
addEventListener('popstate',()=>openCategory(new URLSearchParams(location.search).get('category')));
fetch('books-config.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{cfg=c;categories=(c.categories||[]).filter(x=>x.enabled!==false).sort((a,b)=>(a.order||0)-(b.order||0));openCategory(q.get('category'))}).catch(()=>status(en()?'Unable to load categories. Reload the page.':'تعذر تحميل الأقسام. حدّث الصفحة.'));
</script></body></html>
