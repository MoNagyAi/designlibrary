<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتبة التصميم</title><style>
:root{--ink:#292334;--purple:#870b91;--paper:#f6f3f8;--muted:#756d80}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(130deg,#32103b,#780b86);color:#fff;padding:30px 22px 25px;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:13px}.brand img{width:51px;height:51px;object-fit:cover;border-radius:14px;background:#fff}
h1{font-size:25px;line-height:1.5;margin:0}.brand p{font-size:12px;margin:3px 0 0;color:#e2cce9}
.intro{font-size:17px;margin:25px 0 8px;font-weight:bold}.note{color:#e6d4eb;line-height:1.8;font-size:12px;margin:0}
.search-area{position:sticky;top:0;z-index:3;background:var(--paper);padding:18px 18px 10px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e6ddec;border-radius:15px;padding:0 12px;box-shadow:0 5px 14px #31113907}
.search svg{width:20px;flex-shrink:0;color:var(--purple)}input{background:transparent;border:0;outline:none;width:100%;padding:16px 3px;font:14px Tahoma,Arial;color:var(--ink)}
.clear{border:0;background:#f1e9f5;color:var(--purple);border-radius:50%;width:26px;height:26px;flex-shrink:0;font-size:20px;cursor:pointer}
.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding:12px 0 2px}.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid #e4dce9;background:#fff;border-radius:20px;padding:9px 15px;font:12px Tahoma;color:#66576e;cursor:pointer}.chip.active{background:var(--purple);border-color:var(--purple);color:#fff}
main{padding:0 18px 28px;max-width:1000px;margin:auto}.row{display:flex;align-items:center;justify-content:space-between;padding:15px 2px}.row h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{position:relative;min-width:0;text-align:right;background:white;border:1px solid #e8e0ec;border-radius:17px;padding:16px 13px;min-height:148px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:13px}
.card:active{background:#f1e4f6;transform:scale(.985)}.card:focus-visible,.chip:focus-visible{outline:3px solid #c58ace;outline-offset:2px}
.card .icon{display:flex;align-items:center;justify-content:center;width:35px;height:35px;border-radius:11px;background:#f4eaf7;color:var(--purple)}.icon svg{width:20px;height:20px}
.card strong{font-size:12px;font-weight:600;line-height:1.8;overflow-wrap:anywhere;width:100%}.card .arrow{position:absolute;left:13px;top:20px;color:#a392ac;font-size:19px}
#empty{text-align:center;padding:45px 15px;color:var(--muted);line-height:2}footer{text-align:center;color:#998da2;font-size:11px;padding:20px}
#notice{position:fixed;bottom:18px;left:18px;right:18px;padding:14px;background:#34203d;color:white;border-radius:12px;z-index:5;text-align:center;font-size:13px}
@media(min-width:650px){header{padding:32px max(24px,calc((100vw - 960px)/2));border-radius:0}.search-area{padding-right:max(18px,calc((100vw - 964px)/2));padding-left:max(18px,calc((100vw - 964px)/2))}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.card strong{font-size:13px}}
</style></head><body>

function openPage(index){location.href=encodeURIComponent(PAGE_FILES[index-1]);}
function render(){const q=norm(document.getElementById('search').value);const words=q.split(' ').filter(Boolean);const list=DATA.filter(x=>{const t=norm(x.title);return words.every(w=>t.includes(w))&&(!chosen||new RegExp(chosen,'i').test(t));});const grid=document.getElementById('grid');grid.textContent='';const frag=document.createDocumentFragment();list.forEach(x=>{const b=document.createElement('button');b.className='card';b.dataset.index=x.index;b.setAttribute('aria-label',x.title);b.innerHTML='<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></svg></span><span class="arrow" aria-hidden="true">‹</span>';const t=document.createElement('strong');t.textContent=x.title;b.appendChild(t);b.onclick=()=>openPage(x.index);frag.appendChild(b);});grid.appendChild(frag);document.getElementById('count').textContent=list.length+' قسم';document.getElementById('empty').hidden=!!list.length;document.getElementById('clear').hidden=!q;}
filters.forEach(([label,value],i)=>{const b=document.createElement('button');b.className='chip'+(!i?' active':'');b.textContent=label;b.onclick=()=>{chosen=value;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};document.querySelector('.filters').appendChild(b);});
document.getElementById('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,100);});document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';render();};render();
