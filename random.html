<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة عشوائية</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f5efe3;font-family:Tahoma,Arial;text-align:center;padding:24px}.card{max-width:520px;background:#17151b;border:1px solid #3a3142;border-radius:20px;padding:26px;box-shadow:0 18px 50px #0007}h1{margin:0 0 10px;color:#e0b23d}p{color:#c9c0cf;line-height:1.8}.spin{font-size:40px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}button{margin-top:14px;padding:12px 18px;border:0;border-radius:12px;background:#e0b23d;color:#17120a;font-weight:bold}</style></head><body><div class="card"><div class="spin">🎲</div><h1>مكتبة عشوائية</h1><p id="msg">جارٍ اختيار مكتبة لك…</p><button id="retry" hidden>حاول مرة أخرى</button></div><script>
const BASE='https://monagyai.github.io/designlibrary/';
async function go(){const msg=document.getElementById('msg'),retry=document.getElementById('retry');retry.hidden=true;try{const r=await fetch(BASE+'app-config.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const c=await r.json();let a=(c.categories||[]).filter(x=>x&&x.enabled!==false&&x.page);if(!a.length)throw Error();const last=localStorage.getItem('dl-random-last');if(a.length>1)a=a.filter(x=>String(x.index)!==last);const pick=a[Math.floor(Math.random()*a.length)];localStorage.setItem('dl-random-last',String(pick.index));msg.textContent='تم الاختيار: '+(pick.ar||pick.en||'');setTimeout(()=>location.replace(new URL(pick.page,BASE).href),350)}catch(e){msg.textContent='تعذر تحميل المكتبات الآن. تحقق من الاتصال وحاول مرة أخرى.';retry.hidden=false}}
document.getElementById('retry').onclick=go;go();
</script></body></html>
