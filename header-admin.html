<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الهيدر</title><style>body{margin:0;background:#07111b;color:#fff;font:15px Tahoma,Arial}main{max-width:760px;margin:auto;padding:22px}section{background:#0d1b29;border:1px solid #35516a;border-radius:16px;padding:18px;margin:16px 0}input,select,button{font:inherit}input,select{width:100%;padding:11px;margin:6px 0 14px;box-sizing:border-box;background:#07121d;color:#fff;border:1px solid #506579;border-radius:9px}button{padding:11px 16px;background:#241b09;color:#ffd76a;border:1px solid #b9851c;border-radius:10px;cursor:pointer;margin:4px}img{width:100%;max-height:250px;object-fit:cover;border:1px solid #d7a42d;border-radius:12px;display:none}h1{color:#efbd43}</style><main><h1>إدارة هيدر Design Library</h1><section><label>رابط صورة الهيدر HTTPS</label><input id="url" dir="ltr" placeholder="https://..."><label>ارتفاع الهيدر</label><input id="height" type="number" min="70" max="220" value="116"><label>طريقة العرض</label><select id="fit"><option value="centerCrop">ملء المساحة</option><option value="fitCenter">الصورة كاملة</option></select><label><input id="enabled" type="checkbox" checked style="width:auto"> تفعيل الهيدر البعيد</label><br><button id="previewBtn">معاينة</button><button id="loadBtn">تحميل المنشور</button><button id="downloadBtn">تنزيل الإعداد</button></section><section><img id="preview"><p id="status">بعد التنزيل استبدل ملف header-config.json في GitHub ثم Commit وPush.</p></section></main><script>const q=i=>document.getElementById(i),cfg=()=>({schemaVersion:1,revision:Date.now(),enabled:q('enabled').checked,image:q('url').value.trim(),heightDp:Number(q('height').value)||116,scaleType:q('fit').value});function prev(){let u=q('url').value.trim(),i=q('preview');if(!u){i.style.display='none';return}i.src=u;i.style.display='block';i.style.height=q('height').value+'px';i.style.objectFit=q('fit').value==='fitCenter'?'contain':'cover'}q('previewBtn').onclick=prev;q('loadBtn').onclick=async()=>{try{let r=await fetch('header-config.json?t='+Date.now(),{cache:'no-store'}),c=await r.json();q('enabled').checked=c.enabled!==false;q('url').value=c.image||'';q('height').value=c.heightDp||116;q('fit').value=c.scaleType||'centerCrop';prev();q('status').textContent='تم تحميل الإعداد المنشور.'}catch(e){q('status').textContent='تعذر التحميل.'}};q('downloadBtn').onclick=()=>{let b=new Blob([JSON.stringify(cfg(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='header-config.json';a.click();q('status').textContent='تم تنزيل الملف. ارفعه إلى GitHub.'};</script></html>
